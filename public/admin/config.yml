# Local testing configuration (explained in Step 3)
local_backend: true

backend:
  name: github
  repo: lucascapistrant/mgxcwebsite # Path to your GitHub repo
  branch: main

media_folder: "public/images" # Where uploaded images go
public_folder: "/images"       # How Vue references those images

logo:
  src: /public/mgxc_logo.png
  show_in_header: true

collections:
  - name: "sponsor-logos"
    label: "Sponsor Logos"
    folder: "src/content/sponsor-logos"
    create: true
    fields:
      - { label: "Sponsor Logo", name: "sponsor_logo", widget: "image" }
      - { label: "Company Website Link", name: "company_link", widget: "string" }
  - name: "hero-images"
    label: "Front page images"
    folder: "src/content/hero-images"
    create: true
    fields:
      - {label: "Featured Image", name: "hero_image", widget: "image"}
  - name: "posts"
    label: "Post"
    folder: "src/content/posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime", format: "MMM, DD, YYYY" }
      - label: "Images"
        name: "images"
        widget: "list"
        required: false
        field: { label: "Image", name: "image", widget: "image" }
      - { label: "Body Text", name: "body", widget: "markdown", required: false }
  - name: "schedule"
    label: "Schedule"
    folder: "src/content/schedule"
    create: true
    fields:
      - { label: "Event Name", name: "event_name", widget: "string" }
      - { label: "Event Date", name: "event_date", widget: "datetime", format: "MMM, DD, YYYY h:mm A" }
      - { label: "Event Location", name: "event_location", widget: "string", required: false }
      - { label: "Event Description", name: "event_description", widget: "markdown", required: false }
  - name: "records"
    label: "Records"
    folder: "src/content/records"
    create: true
    fields:
      - { label: "Record Type", name: "record_type", widget: "select", options: ["5k Race", "2 Mile Race"] }
      - { label: "Athlete Gender", name: "record_gender", widget: "select", options: ["Male", "Female"] }
      - { label: "Athlete Name", name: "athlete_name", widget: "string" }
      - { label: "Race Time", name: "race_time", widget: "string", hint: "Format as MM:SS.mm (e.g., 17:46.12 or 9:54.1)",pattern: ['^\d{1,2}:\d{2}\.\d{1,2}$', "Must be in minutes:seconds.milliseconds format (e.g., 17:46.12 or 9:54.1)"] }